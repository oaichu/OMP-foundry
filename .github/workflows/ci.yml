name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install
      - name: typecheck
        run: bun run typecheck
      - run: bun test
      - name: syntax smoke index.ts
        run: bun -e "new Bun.Transpiler({loader:'ts'}).transformSync(await Bun.file('src/index.ts').text())"
