name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: typecheck
        run: bun run typecheck
      - run: bun test
      - name: extension syntax smoke
        run: bun -e "new Bun.Transpiler({loader:'ts'}).transformSync(await Bun.file('src/index.ts').text())"
      - name: checkout current Oh My Pi contract
        uses: actions/checkout@v4
        with:
          repository: can1357/oh-my-pi
          path: .ci/oh-my-pi
          fetch-depth: 1
      - name: OMP API contract smoke
        run: bun run check:omp-contract -- .ci/oh-my-pi
