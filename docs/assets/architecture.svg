<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-label="Architecture Map">
  <defs>
    <style>
      .bg { fill: #0D0D0D; stroke: #262626; stroke-width: 1; }
      .text { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; }
      .folder { fill: #FFB020; font-weight: bold; }
      .file { fill: #FFF6E8; }
      .comment { fill: #6B7280; font-style: italic; }
      .tree { fill: #404040; }
      
      @keyframes popIn {
        from { opacity: 0; transform: translateX(-10px); }
        to { opacity: 1; transform: translateX(0); }
      }
      .item { animation: popIn 0.3s forwards; opacity: 0; }
    </style>
  </defs>
  
  <rect width="800" height="360" rx="8" class="bg"/>
  
  <circle cx="20" cy="20" r="6" fill="#404040"/>
  <circle cx="40" cy="20" r="6" fill="#404040"/>
  <circle cx="60" cy="20" r="6" fill="#404040"/>
  <text x="400" y="24" fill="#555" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="600">tree — src/</text>

  <g class="text" transform="translate(30, 60)">
    <g class="item" style="animation-delay: 0.1s"><text y="0"><tspan class="folder">src/</tspan></text></g>
    <g class="item" style="animation-delay: 0.2s"><text y="24"><tspan class="tree">├── </tspan><tspan class="file">index.ts</tspan><tspan x="220" class="comment"># Plugin entrypoint, lifecycle hooks, tool registration</tspan></text></g>
    <g class="item" style="animation-delay: 0.3s"><text y="48"><tspan class="tree">├── </tspan><tspan class="file">gates.ts</tspan><tspan x="220" class="comment"># Approval gates, state guards, phase transitions</tspan></text></g>
    <g class="item" style="animation-delay: 0.4s"><text y="72"><tspan class="tree">├── </tspan><tspan class="file">permissions.ts</tspan><tspan x="220" class="comment"># Path canonicalization &amp; mutation boundaries</tspan></text></g>
    <g class="item" style="animation-delay: 0.5s"><text y="96"><tspan class="tree">├── </tspan><tspan class="file">aatp.ts</tspan><tspan x="220" class="comment"># Work-order DAG engine, dependency graph &amp; tickets</tspan></text></g>
    <g class="item" style="animation-delay: 0.6s"><text y="120"><tspan class="tree">├── </tspan><tspan class="file">plan.ts</tspan><tspan x="220" class="comment"># 3-Stage Master Plan lifecycle (Draft, Redteam, Synth)</tspan></text></g>
    <g class="item" style="animation-delay: 0.7s"><text y="144"><tspan class="tree">├── </tspan><tspan class="file">patch-gate.ts</tspan><tspan x="220" class="comment"># Unified diff parsing, ≤80 line cap &amp; atomic commit</tspan></text></g>
    <g class="item" style="animation-delay: 0.8s"><text y="168"><tspan class="tree">├── </tspan><tspan class="file">release.ts</tspan><tspan x="220" class="comment"># Provenance ledger &amp; release derivation</tspan></text></g>
    <g class="item" style="animation-delay: 0.9s"><text y="192"><tspan class="tree">├── </tspan><tspan class="file">git-runtime.ts</tspan><tspan x="220" class="comment"># Hardened Git environment &amp; hook sanitization</tspan></text></g>
    <g class="item" style="animation-delay: 1.0s"><text y="216"><tspan class="tree">├── </tspan><tspan class="file">verify-runner.ts</tspan><tspan x="220" class="comment"># Disposable QA test execution sandbox</tspan></text></g>
    <g class="item" style="animation-delay: 1.1s"><text y="240"><tspan class="tree">└── </tspan><tspan class="folder">skills/</tspan><tspan x="220" class="comment"># JIT skill registry, stack detector &amp; parsers</tspan></text></g>
    
    <g class="item" style="animation-delay: 1.3s"><text y="275" class="folder">1 directory, 10 files</text></g>
  </g>
</svg>
