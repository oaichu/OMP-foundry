<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="OMP Foundry Governed Architecture Map">
  <defs>
    <!-- Deep Obsidian Backdrop -->
    <linearGradient id="foundryBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080A"/>
      <stop offset="50%" stop-color="#111116"/>
      <stop offset="100%" stop-color="#060608"/>
    </linearGradient>

    <!-- Glass Cards Gradients -->
    <linearGradient id="foundryCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.07)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>

    <!-- Border Glow Gradients -->
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB020"/>
      <stop offset="100%" stop-color="#FF8800"/>
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>

    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFB2"/>
      <stop offset="100%" stop-color="#00B887"/>
    </linearGradient>

    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="100%" stop-color="#FF1744"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="fLaser" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="fSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Radial Lighting Orbs -->
    <radialGradient id="fOrbGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB020" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="fOrbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="fOrbGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FFB2" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, 'SF Pro Display', 'Inter', system-ui, sans-serif; }

      @keyframes flowData {
        from { stroke-dashoffset: 64; }
        to { stroke-dashoffset: 0; }
      }

      @keyframes pulseAura {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.95; }
      }

      @keyframes beaconPing {
        0% { r: 3; opacity: 1; }
        100% { r: 12; opacity: 0; }
      }

      .wire-gold {
        stroke: #FFB020;
        stroke-dasharray: 6 6;
        animation: flowData 1.8s linear infinite;
      }

      .wire-cyan {
        stroke: #00D2FF;
        stroke-dasharray: 6 6;
        animation: flowData 1.8s linear infinite;
      }

      .wire-green {
        stroke: #00FFB2;
        stroke-dasharray: 6 6;
        animation: flowData 1.6s linear infinite;
      }

      .aura-pulse { animation: pulseAura 2.2s ease-in-out infinite; }
      .ping-ring { animation: beaconPing 1.8s cubic-bezier(0, 0.2, 0.8, 1) infinite; transform-origin: center; }
    </style>
  </defs>

  <!-- Container Backdrop -->
  <rect width="960" height="560" rx="18" fill="url(#foundryBg)" stroke="#22242D" stroke-width="1.5"/>

  <!-- Circuit Blueprint Grid -->
  <g stroke="rgba(255, 255, 255, 0.02)" stroke-width="1">
    <line x1="0" y1="140" x2="960" y2="140"/>
    <line x1="0" y1="280" x2="960" y2="280"/>
    <line x1="0" y1="420" x2="960" y2="420"/>
    <line x1="240" y1="0" x2="240" y2="560"/>
    <line x1="480" y1="0" x2="480" y2="560"/>
    <line x1="720" y1="0" x2="720" y2="560"/>
  </g>

  <!-- Lighting Orbs -->
  <circle cx="220" cy="160" r="230" fill="url(#fOrbGold)"/>
  <circle cx="480" cy="280" r="250" fill="url(#fOrbCyan)"/>
  <circle cx="800" cy="380" r="220" fill="url(#fOrbGreen)"/>

  <!-- Top Title Header Bar -->
  <g transform="translate(32, 28)">
    <circle cx="0" cy="6" r="5" fill="#FF5F56"/>
    <circle cx="16" cy="6" r="5" fill="#FFBD2E"/>
    <circle cx="32" cy="6" r="5" fill="#27C93F"/>

    <rect x="58" y="-6" width="380" height="24" rx="6" fill="rgba(255, 176, 32, 0.08)" stroke="rgba(255, 176, 32, 0.25)" stroke-width="1"/>
    <text x="70" y="10" fill="#FFB020" class="mono" font-size="11" font-weight="700" letter-spacing="1">OMP FOUNDRY v0.8.23 KERNEL TOPOLOGY</text>
    <text x="360" y="10" fill="#71717A" class="mono" font-size="11">· GOVERNED</text>

    <!-- Live Authority Indicator -->
    <g transform="translate(720, 4)">
      <circle cx="0" cy="0" r="4" fill="#00FFB2"/>
      <circle cx="0" cy="0" r="4" fill="#00FFB2" class="ping-ring" stroke="#00FFB2" stroke-width="1.5"/>
      <text x="12" y="4" fill="#00FFB2" class="sans" font-size="12" font-weight="700">HUMAN AUTHORITY ACTIVE</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- ACTIVE LASER HIGHWAYS (CONNECTORS) -->
  <!-- ========================================================================= -->

  <!-- 1. Human CEO -> Triad Consensus -->
  <path d="M 235 155 L 310 155" fill="none" stroke="rgba(255, 176, 32, 0.15)" stroke-width="2.5"/>
  <path d="M 235 155 L 310 155" fill="none" class="wire-gold" stroke-width="2.5" filter="url(#fLaser)"/>

  <!-- 2. Triad Consensus -> Kernel Engine -->
  <path d="M 520 155 L 590 155 L 590 230 L 480 230 L 480 260" fill="none" stroke="rgba(0, 210, 255, 0.15)" stroke-width="2.5"/>
  <path d="M 520 155 L 590 155 L 590 230 L 480 230 L 480 260" fill="none" class="wire-cyan" stroke-width="2.5" filter="url(#fLaser)"/>

  <!-- 3. Kernel Engine -> AATP Work Order DAG -->
  <path d="M 390 320 L 235 320" fill="none" stroke="rgba(0, 210, 255, 0.15)" stroke-width="2.5"/>
  <path d="M 390 320 L 235 320" fill="none" class="wire-cyan" stroke-width="2.5" filter="url(#fLaser)"/>

  <!-- 4. AATP -> Patch Gate Enforcer -->
  <path d="M 135 380 L 135 440 L 390 440" fill="none" stroke="rgba(0, 255, 178, 0.15)" stroke-width="2.5"/>
  <path d="M 135 380 L 135 440 L 390 440" fill="none" class="wire-green" stroke-width="2.5" filter="url(#fLaser)"/>

  <!-- 5. Kernel Engine -> Verification Sandbox -->
  <path d="M 570 320 L 725 320" fill="none" stroke="rgba(0, 255, 178, 0.15)" stroke-width="2.5"/>
  <path d="M 570 320 L 725 320" fill="none" class="wire-green" stroke-width="2.5" filter="url(#fLaser)"/>

  <!-- 6. Verification Sandbox -> Git Hardened Commit -->
  <path d="M 825 380 L 825 440 L 570 440" fill="none" stroke="rgba(0, 255, 178, 0.15)" stroke-width="2.5"/>
  <path d="M 825 380 L 825 440 L 570 440" fill="none" class="wire-green" stroke-width="2.5" filter="url(#fLaser)"/>

  <!-- Wire Protocol Labels -->
  <g class="mono" font-size="9" font-weight="700">
    <rect x="238" y="143" width="68" height="18" rx="4" fill="#111116" stroke="rgba(255, 176, 32, 0.4)" stroke-width="1"/>
    <text x="244" y="155" fill="#FFB020">⚡ INTENT</text>

    <rect x="255" y="308" width="112" height="18" rx="4" fill="#111116" stroke="rgba(0, 210, 255, 0.4)" stroke-width="1"/>
    <text x="261" y="320" fill="#00D2FF">📋 ATOMIC DAG</text>

    <rect x="590" y="308" width="112" height="18" rx="4" fill="#111116" stroke="rgba(0, 255, 178, 0.4)" stroke-width="1"/>
    <text x="596" y="320" fill="#00FFB2">🛡️ QA VERIFY</text>

    <rect x="190" y="430" width="124" height="18" rx="4" fill="#111116" stroke="rgba(0, 255, 178, 0.4)" stroke-width="1"/>
    <text x="196" y="442" fill="#00FFB2">🔒 DIFF CAP ≤80</text>
  </g>


  <!-- ========================================================================= -->
  <!-- ARCHITECTURE NODES -->
  <!-- ========================================================================= -->

  <!-- NODE 1: HUMAN CEO & INTENT GATEWAY (Top-Left) -->
  <g transform="translate(35, 95)">
    <rect width="200" height="120" rx="14" fill="url(#foundryCard)" stroke="url(#goldGlow)" stroke-width="1.4" filter="url(#fSoft)"/>
    <rect width="200" height="120" rx="14" fill="#120F08" opacity="0.9"/>
    
    <rect x="12" y="12" width="24" height="24" rx="6" fill="rgba(255, 176, 32, 0.18)"/>
