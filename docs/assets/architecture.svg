  <g transform="translate(310, 95)">
    <rect width="210" height="120" rx="14" fill="url(#foundryCard)" stroke="url(#goldGlow)" stroke-width="1.4" filter="url(#fSoft)"/>
    <rect width="210" height="120" rx="14" fill="#120F08" opacity="0.9"/>
    
