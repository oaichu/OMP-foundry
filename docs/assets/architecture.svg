    <text x="44" y="24" fill="#FFFFFF" class="sans" font-size="13" font-weight="800">Triad Consensus</text>
    <text x="44" y="35" fill="#A1A1AA" class="mono" font-size="9.5">plan.ts (Draft · Red · Synth)</text>

    <g class="sans" font-size="10.5" fill="#D4D4D8" transform="translate(14, 56)">
