    </g>

    <circle cx="164" cy="20" r="4" fill="#00D2FF" class="aura-pulse"/>
  </g>

  <!-- NODE 5: AATP DAG & WORK-ORDER QUEUE (Center-Left) -->
  <g transform="translate(35, 260)">
    <rect width="200" height="120" rx="14" fill="url(#foundryCard)" stroke="url(#cyanGlow)" stroke-width="1.4" filter="url(#fSoft)"/>
    <rect width="200" height="120" rx="14" fill="#080F16" opacity="0.9"/>
    
    <rect x="12" y="12" width="24" height="24" rx="6" fill="rgba(0, 210, 255, 0.18)"/>
    <circle cx="24" cy="24" r="5" fill="#00D2FF"/>
    <text x="44" y="24" fill="#FFFFFF" class="sans" font-size="13" font-weight="800">AATP Engine</text>
    <text x="44" y="35" fill="#00D2FF" class="mono" font-size="9.5">aatp.ts · Work Orders</text>

    <g class="sans" font-size="10.5" fill="#A1A1AA" transform="translate(14, 56)">
      <text y="0">• Micro-Task Decomposition</text>
      <text y="16">• Explicit File Allowlist (≤3)</text>
      <text y="32">• Topological DAG Queue</text>
      <text y="48">• Zero Scope Drift Policy</text>
    </g>

    <circle cx="184" cy="20" r="4" fill="#00D2FF" class="aura-pulse"/>
  </g>

