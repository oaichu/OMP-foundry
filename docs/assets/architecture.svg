      <text y="16">• Instant "ok / skip / proceed"</text>
      <text y="32">• Phase lock approvals</text>
      <text y="48">• Strict unblock authority</text>
    </g>

    <circle cx="184" cy="20" r="4" fill="#FFB020" class="aura-pulse"/>
  </g>

