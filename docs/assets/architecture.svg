      <text y="16">• Zero context tax / On-demand</text>
      <text y="32">• 15 Specialized tool packs</text>
      <text y="48">• Auto-injected to micro-tasks</text>
    </g>

    <circle cx="184" cy="20" r="4" fill="#00D2FF" class="aura-pulse"/>
  </g>

  <!-- NODE 4: FOUNDRY KERNEL DISPATCHER (Center Core) -->
  <g transform="translate(390, 260)">
    <rect width="180" height="120" rx="16" fill="url(#foundryCard)" stroke="url(#cyanGlow)" stroke-width="1.8" filter="url(#fSoft)"/>
    <rect width="180" height="120" rx="16" fill="#09131C" opacity="0.95"/>
    
    <circle cx="26" cy="24" r="12" fill="rgba(0, 210, 255, 0.25)"/>
    <circle cx="26" cy="24" r="5" fill="#00D2FF"/>
    <text x="44" y="24" fill="#FFFFFF" class="sans" font-size="13" font-weight="800">Foundry Kernel</text>
    <text x="44" y="35" fill="#00D2FF" class="mono" font-size="9.5">index.ts · Dispatcher</text>

    <g class="sans" font-size="10" fill="#93C5FD" transform="translate(12, 54)">
      <text y="0">• 15 Governed CLI Commands</text>
      <text y="14">• State Machine Lifecycle Guards</text>
      <text y="28">• Permission Boundary Gate</text>
      <text y="42">• Fast/Lite/Full Model Router</text>
