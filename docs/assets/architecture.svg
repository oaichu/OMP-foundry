  <!-- Bottom Legend Footer -->
  <g transform="translate(35, 520)" class="sans">
    <rect x="0" y="0" width="890" height="24" rx="6" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1"/>
    <circle cx="14" cy="12" r="3.5" fill="#FFB020"/>
    <text x="24" y="15.5" fill="#A1A1AA" font-size="10.5" font-weight="600">Human Superiority</text>

    <circle cx="144" cy="12" r="3.5" fill="#00D2FF"/>
    <text x="154" y="15.5" fill="#A1A1AA" font-size="10.5" font-weight="600">3-Stage Triad Consensus</text>

