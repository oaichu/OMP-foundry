  <g transform="translate(725, 260)">
    <rect width="200" height="120" rx="14" fill="url(#foundryCard)" stroke="url(#greenGlow)" stroke-width="1.4" filter="url(#fSoft)"/>
    <rect width="200" height="120" rx="14" fill="#08140F" opacity="0.9"/>
    
    <rect x="12" y="12" width="24" height="24" rx="6" fill="rgba(0, 255, 178, 0.18)"/>
    <path d="M 18 24 L 23 29 L 30 19" stroke="#00FFB2" stroke-width="2" stroke-linecap="round" fill="none"/>
    <text x="44" y="24" fill="#FFFFFF" class="sans" font-size="13" font-weight="800">Verify Runner</text>
    <text x="44" y="35" fill="#00FFB2" class="mono" font-size="9.5">verify-runner.ts · QA</text>

    <g class="sans" font-size="10.5" fill="#A7F3D0" transform="translate(14, 56)">
