<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 220" role="img" aria-label="Foundry pipeline">
  <defs>
    <style>
      @keyframes flowDash {
        to { stroke-dashoffset: -24; }
      }
      @keyframes pulseShadow {
        0%, 100% { filter: drop-shadow(0 0 3px rgba(255,159,28,0.2)); }
        50% { filter: drop-shadow(0 0 12px rgba(255,159,28,0.8)); }
      }
      @keyframes floatUp {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      .flow-arrow { stroke-dasharray: 8 4; animation: flowDash 1s linear infinite; stroke-linecap: round; }
      .box { transform-origin: center; }
      .box-1 { animation: floatUp 4s ease-in-out infinite 0s, pulseShadow 4s ease-in-out infinite 0s; }
      .box-2 { animation: floatUp 4s ease-in-out infinite 0.5s, pulseShadow 4s ease-in-out infinite 0.5s; }
      .box-3 { animation: floatUp 4s ease-in-out infinite 1s, pulseShadow 4s ease-in-out infinite 1s; }
      .box-4 { animation: floatUp 4s ease-in-out infinite 1.5s, pulseShadow 4s ease-in-out infinite 1.5s; }
      .box-5 { animation: floatUp 4s ease-in-out infinite 2s, pulseShadow 4s ease-in-out infinite 2s; }
      .box-6 { animation: floatUp 4s ease-in-out infinite 2.5s, pulseShadow 4s ease-in-out infinite 2.5s; }
    </style>
  </defs>
  <rect width="1100" height="220" rx="20" fill="#14110E"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    <g class="box box-1">
      <rect x="24" y="58" width="140" height="88" rx="14" fill="#2A2118" stroke="#FFB020" stroke-width="2"/>
      <text x="94" y="98" fill="#FFD37A">PRODUCT</text>
      <text x="94" y="120" fill="#C9B8A2" font-weight="500">you decide</text>
    </g>
    <g class="box box-2">
      <rect x="196" y="58" width="160" height="88" rx="14" fill="#2A2118" stroke="#FF9F1C" stroke-width="2"/>
      <text x="276" y="92" fill="#FFD37A">PLAN</text>
      <text x="276" y="112" fill="#C9B8A2" font-weight="500">draft → critique</text>
      <text x="276" y="130" fill="#C9B8A2" font-weight="500">→ lock</text>
    </g>
    <g class="box box-3">
      <rect x="388" y="58" width="140" height="88" rx="14" fill="#2A2118" stroke="#E4572E" stroke-width="2"/>
      <text x="458" y="98" fill="#FFB020">DESIGN</text>
      <text x="458" y="120" fill="#C9B8A2" font-weight="500">you approve</text>
    </g>
    <g class="box box-4">
      <rect x="560" y="58" width="140" height="88" rx="14" fill="#2A2118" stroke="#FFB020" stroke-width="2"/>
      <text x="630" y="98" fill="#FFD37A">AATP</text>
      <text x="630" y="120" fill="#C9B8A2" font-weight="500">work orders</text>
    </g>
    <g class="box box-5">
      <rect x="732" y="58" width="160" height="88" rx="14" fill="#2A2118" stroke="#FF9F1C" stroke-width="2"/>
      <text x="812" y="98" fill="#FFD37A">POUR</text>
      <text x="812" y="120" fill="#C9B8A2" font-weight="500">workers + review</text>
    </g>
    <g class="box box-6">
      <rect x="924" y="58" width="152" height="88" rx="14" fill="#3A1C12" stroke="#E4572E" stroke-width="2"/>
      <text x="1000" y="98" fill="#FFB020">RELEASE</text>
      <text x="1000" y="120" fill="#C9B8A2" font-weight="500">QA gate</text>
    </g>
    <!-- Flow arrows -->
    <path class="flow-arrow" d="M164 102h32M356 102h32M528 102h32M700 102h32M892 102h32" stroke="#FF9F1C" stroke-width="4"/>
  </g>
</svg>
