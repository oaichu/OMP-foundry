<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" role="img" aria-label="OMP Foundry — Lock the plan. Then pour the code.">
  <defs>
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.6; transform: scale(0.98); }
        50% { opacity: 1; transform: scale(1.02); }
      }
      @keyframes slideGrid {
        from { stroke-dashoffset: 80; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes floatText {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      @keyframes glowText {
        0%, 100% { filter: drop-shadow(0 0 8px rgba(255,159,28,0.4)); }
        50% { filter: drop-shadow(0 0 20px rgba(255,159,28,0.9)); }
      }
      @keyframes pourLiquid {
        0% { transform: translateY(-10px); opacity: 0.5; }
        50% { opacity: 1; }
        100% { transform: translateY(10px); opacity: 0.5; }
      }
      .glow-obj { animation: pulseGlow 5s ease-in-out infinite; transform-origin: 640px 300px; }
      .grid-lines path { stroke-dasharray: 4 8; animation: slideGrid 30s linear infinite; }
      .title-text { animation: floatText 4s ease-in-out infinite, glowText 4s ease-in-out infinite; transform-origin: center; }
      .liquid { animation: pourLiquid 2s linear infinite; transform-origin: center; }
      .crucible { animation: floatText 6s ease-in-out infinite; transform-origin: center; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E0C0A"/>
      <stop offset="1" stop-color="#1A1410"/>
    </linearGradient>
    <linearGradient id="pour" x1="640" y1="80" x2="640" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD37A"/>
      <stop offset=".45" stop-color="#FF9F1C"/>
      <stop offset="1" stop-color="#E4572E"/>
    </linearGradient>
    <radialGradient id="glow" cx="640" cy="300" r="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF9F1C" stop-opacity=".35"/>
      <stop offset="1" stop-color="#FF9F1C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="560" fill="url(#bg)"/>
  <rect width="1280" height="560" fill="url(#glow)" class="glow-obj"/>
  <g opacity=".4" fill="none" stroke="#3A2A1C" stroke-width="1" class="grid-lines">
    <path d="M80 80h1120M80 160h1120M80 240h1120M80 320h1120M80 400h1120M80 480h1120"/>
    <path d="M160 40v480M320 40v480M480 40v480M640 40v480M800 40v480M960 40v480M1120 40v480"/>
  </g>
  
  <g class="crucible">
    <path d="M600 70h80l24 48H576z" fill="#2A2118" stroke="#FFB020" stroke-width="3"/>
  </g>
  
  <!-- Clipping mask for pouring liquid -->
  <clipPath id="liquidClip">
     <path d="M628 118v86c0 8 4 14 12 18l48 22v42H592v-42l48-22c8-4 12-10 12-18v-86z" />
  </clipPath>
  
  <g clip-path="url(#liquidClip)">
    <rect x="580" y="80" width="120" height="260" fill="url(#pour)" class="liquid" />
  </g>
  
  <!-- Outer liquid path for stroke/border if any (none in original, but keeping base shape for glow) -->
  <path d="M628 118v86c0 8 4 14 12 18l48 22v42H592v-42l48-22c8-4 12-10 12-18v-86z" fill="none" stroke="#FF9F1C" stroke-width="1" opacity="0.3"/>
  
  <g class="crucible">
    <rect x="520" y="286" width="240" height="18" rx="4" fill="#FFB020"/>
    <path d="M500 316h280l36 92H464z" fill="#241C16" stroke="#E4572E" stroke-width="3"/>
  </g>

  <g class="title-text">
    <text x="640" y="448" text-anchor="middle" fill="#FFF6E8" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="56" font-weight="800" letter-spacing="6">OMP FOUNDRY</text>
    <text x="640" y="498" text-anchor="middle" fill="#FFB020" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="22" letter-spacing="4" font-weight="600">LOCK THE PLAN. THEN POUR THE CODE.</text>
  </g>
</svg>
