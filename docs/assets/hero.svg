<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-label="OMP Foundry Banner">
  <defs>
    <style>
      @keyframes scanline {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(600px); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes glowPulse {
        0%, 100% { filter: drop-shadow(0 0 10px rgba(255, 176, 32, 0.5)); opacity: 0.8; }
        50% { filter: drop-shadow(0 0 25px rgba(255, 176, 32, 1)); opacity: 1; }
      }
      @keyframes sparks {
        0% { transform: translateY(0) scale(1); opacity: 1; }
        100% { transform: translateY(-100px) scale(0); opacity: 0; }
      }
      @keyframes circuitFlow {
        to { stroke-dashoffset: -100; }
      }
      @keyframes typeText {
        0% { stroke-dashoffset: 400; fill-opacity: 0; }
        50% { stroke-dashoffset: 0; fill-opacity: 0; }
        100% { stroke-dashoffset: 0; fill-opacity: 1; }
      }
      .bg-gradient { fill: url(#bgGrad); }
      .grid { stroke: rgba(255, 159, 28, 0.07); stroke-width: 1; }
      .scanner { fill: url(#scanGrad); animation: scanline 6s linear infinite; }
      .core { animation: float 6s ease-in-out infinite, glowPulse 4s ease-in-out infinite; transform-origin: center; }
      .spark1 { animation: sparks 2s ease-in infinite 0.1s; }
      .spark2 { animation: sparks 2.5s ease-in infinite 0.5s; }
      .spark3 { animation: sparks 3s ease-in infinite 0.2s; }
      .circuit { stroke-dasharray: 10 20; animation: circuitFlow 3s linear infinite; }
      
      /* Hexagon pulse */
      @keyframes hexPulse {
        0%, 100% { stroke-width: 2; filter: drop-shadow(0 0 5px rgba(255,159,28,0.5)); transform: scale(1); }
        50% { stroke-width: 4; filter: drop-shadow(0 0 20px rgba(228,87,46,0.8)); transform: scale(1.02); }
      }
      .hex { animation: hexPulse 4s ease-in-out infinite; transform-origin: center; }
    </style>
    
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0806" />
      <stop offset="100%" stop-color="#1c140e" />
    </linearGradient>

    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255, 159, 28, 0)" />
      <stop offset="50%" stop-color="rgba(255, 159, 28, 0.2)" />
      <stop offset="100%" stop-color="rgba(255, 159, 28, 0)" />
    </linearGradient>

    <linearGradient id="coreGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD37A" />
      <stop offset="50%" stop-color="#FF9F1C" />
      <stop offset="100%" stop-color="#E4572E" />
    </linearGradient>
    
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255, 159, 28, 0.4)" />
      <stop offset="100%" stop-color="rgba(255, 159, 28, 0)" />
    </radialGradient>
  </defs>

  <!-- Background & Grid -->
  <rect width="100%" height="100%" class="bg-gradient"/>
  <rect width="100%" height="100%" fill="url(#centerGlow)"/>
  
  <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" class="grid"/>
  </pattern>
  <rect width="100%" height="100%" fill="url(#gridPattern)"/>

  <!-- Scanning Line -->
  <rect width="100%" height="150" class="scanner"/>

  <!-- Circuit Lines -->
  <path class="circuit" d="M 0 250 H 350 L 400 200 H 500" fill="none" stroke="#FF9F1C" stroke-width="2" opacity="0.6"/>
  <path class="circuit" d="M 1200 250 H 850 L 800 300 H 700" fill="none" stroke="#E4572E" stroke-width="2" opacity="0.6"/>
  <path class="circuit" d="M 200 500 V 400 L 250 350 H 450" fill="none" stroke="#7EC8A9" stroke-width="2" opacity="0.6"/>
  <path class="circuit" d="M 1000 0 V 100 L 950 150 H 750" fill="none" stroke="#4B9CBF" stroke-width="2" opacity="0.6"/>

  <!-- Core Element (The Lock/Crucible) -->
  <g class="core" transform="translate(600, 210)">
    <!-- Outer Hexagon -->
    <polygon points="0,-80 69,-40 69,40 0,80 -69,40 -69,-40" fill="none" stroke="#FF9F1C" class="hex"/>
    <!-- Inner Diamond -->
    <polygon points="0,-40 40,0 0,40 -40,0" fill="url(#coreGrad)" stroke="#FFD37A" stroke-width="2"/>
    
    <!-- Energy Sparks -->
    <circle cx="-20" cy="-20" r="3" fill="#FFD37A" class="spark1"/>
    <circle cx="20" cy="-30" r="4" fill="#FF9F1C" class="spark2"/>
    <circle cx="0" cy="-40" r="2.5" fill="#E4572E" class="spark3"/>
  </g>

  <!-- Typography -->
  <g text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="600" y="380" font-size="64" font-weight="900" fill="#FFF6E8" letter-spacing="10" style="filter: drop-shadow(0 0 10px rgba(255, 176, 32, 0.6));">OMP FOUNDRY</text>
    <text x="600" y="420" font-size="22" font-weight="600" fill="#FF9F1C" letter-spacing="5" style="filter: drop-shadow(0 0 5px rgba(255, 159, 28, 0.4));">LOCK THE PLAN. THEN POUR THE CODE.</text>
  </g>
  
  <!-- Subtle Binary/Data stream in background -->
  <g font-family="monospace" font-size="10" fill="#E4572E" opacity="0.15">
    <text x="100" y="80">01001111 01001101 01010000</text>
    <text x="100" y="100">01000110 01001111 01010101</text>
    <text x="900" y="400">1100100 01100001 01110100</text>
    <text x="900" y="420">01100001 00100000 01110011</text>
  </g>
</svg>
