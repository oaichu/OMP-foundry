<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" role="img" aria-label="Quickstart Terminal">
  <defs>
    <style>
      .bg { fill: #0D0D0D; stroke: #262626; stroke-width: 1; }
      .text { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; }
      .prompt { fill: #E4572E; font-weight: bold; }
      .cmd { fill: #FFF6E8; }
      .highlight { fill: #FFB020; font-weight: bold; }
      .gray { fill: #888888; }
      .success { fill: #7EC8A9; font-weight: bold; }
      
      @keyframes type1 { 0%, 10% { opacity: 0; } 15%, 100% { opacity: 1; } }
      @keyframes type2 { 0%, 25% { opacity: 0; } 30%, 100% { opacity: 1; } }
      @keyframes type3 { 0%, 45% { opacity: 0; } 50%, 100% { opacity: 1; } }
      @keyframes type4 { 0%, 65% { opacity: 0; } 70%, 100% { opacity: 1; } }
      @keyframes type5 { 0%, 80% { opacity: 0; } 85%, 100% { opacity: 1; } }
      
      .l1 { animation: type1 9s forwards infinite; }
      .l2 { animation: type2 9s forwards infinite; }
      .l3 { animation: type3 9s forwards infinite; }
      .l4 { animation: type4 9s forwards infinite; }
      .l5 { animation: type5 9s forwards infinite; }
    </style>
  </defs>
  
  <rect width="800" height="240" rx="8" class="bg"/>
  
  <!-- Terminal Window Controls -->
  <circle cx="20" cy="20" r="6" fill="#E4572E"/>
  <circle cx="40" cy="20" r="6" fill="#FF9F1C"/>
  <circle cx="60" cy="20" r="6" fill="#7EC8A9"/>
  <text x="400" y="24" fill="#666" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="600">bash — install &amp; bootstrap</text>
  
  <g class="text" transform="translate(30, 62)">
    <g class="l1">
      <text y="0"><tspan class="prompt">❯</tspan> <tspan class="cmd">omp plugin install omp-foundry</tspan></text>
    </g>
    <g class="l2">
      <text y="24" class="gray">✓ Resolving omp-foundry from registry...</text>
      <text y="46" class="success">✓ Installed omp-foundry@0.8.23</text>
    </g>
    <g class="l3">
      <text y="80"><tspan class="prompt">❯</tspan> <tspan class="cmd">omp plugin doctor</tspan></text>
    </g>
    <g class="l4">
      <text y="104" class="success">● omp-foundry<tspan class="gray"> v0.8.23 · Governed Runtime Active</tspan></text>
    </g>
    <g class="l5">
      <text y="138"><tspan class="prompt">❯</tspan> <tspan class="highlight">/foundry Build a high-performance REST API with PostgreSQL</tspan></text>
    </g>
  </g>
</svg>
