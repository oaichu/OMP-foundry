<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" role="img" aria-label="Test Suite Output">
  <defs>
    <style>
      .bg { fill: #0D0D0D; stroke: #262626; stroke-width: 1; }
      .text { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; }
      .prompt { fill: #E4572E; font-weight: bold; }
      .cmd { fill: #FFF6E8; }
      .pass { fill: #7EC8A9; font-weight: bold; }
      .fail { fill: #3A3A3A; }
      .stat { fill: #FFB020; }
      .gray { fill: #888888; }
      
      @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
      .cursor { animation: blink 1s step-end infinite; fill: #FFB020; }
    </style>
  </defs>
  
  <rect width="800" height="240" rx="8" class="bg"/>
  
  <!-- Mac Window Dots -->
  <circle cx="20" cy="20" r="6" fill="#404040"/>
  <circle cx="40" cy="20" r="6" fill="#404040"/>
  <circle cx="60" cy="20" r="6" fill="#404040"/>
  <text x="400" y="24" fill="#555" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="600">bun-test — omp-foundry</text>
  
  <g class="text" transform="translate(30, 60)">
    <text y="0"><tspan class="prompt">❯</tspan> <tspan class="cmd">npx bun test</tspan></text>
    
    <!-- Test execution simulation -->
    <text y="30" class="pass">✓ <tspan class="gray">extension integration smoke &gt; smart /approve naturally approves product and plan states</tspan></text>
    <text y="50" class="pass">✓ <tspan class="gray">extension integration smoke &gt; plan-synth capability write allows writing both MASTER_PLAN...</tspan></text>
    <text y="70" class="pass">✓ <tspan class="gray">Plan governed mode &gt; persists exact Draft → Redteam → Synth sequence</tspan></text>
    
    <text y="110"><tspan class="pass" font-size="16">  128 pass</tspan></text>
    <text y="130"><tspan class="fail">    0 fail</tspan></text>
    <text y="150"><tspan class="stat">  438 expect() calls</tspan></text>
    
    <text y="175" class="gray">Ran 128 tests across 18 files. [1.76s]</text>
    
    <text y="205"><tspan class="prompt">❯</tspan> <tspan class="cmd">npx bun run typecheck</tspan><tspan class="cursor"> █</tspan></text>
  </g>
</svg>
